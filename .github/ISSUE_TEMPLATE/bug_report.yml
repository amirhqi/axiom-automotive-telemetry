name: Bug report
description: Report a reproducible defect in AXIOM
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a reproducible issue.
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: v2.6.0 or commit SHA
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and Qt toolchain
      placeholder: Windows 11, Qt 6.11.1, MinGW 13.1
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: Provide the smallest reliable sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and logs
      render: shell
  - type: textarea
    id: context
    attributes:
      label: Additional context